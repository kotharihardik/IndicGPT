# Gujarati (Model H) - Phase 2 evaluation
# Identical to the other language apart from the example sentences: the two
# models are only comparable if measured the same way.

reports_dir: ../report/phase2/gujarati/gujarati_16k
checkpoint_tag: best              # 'best' (lowest validation loss) or 'latest'

# Each prompt is the first 64 tokens of a held-out document; the model writes 96
# and is scored against the real next 96. Prompts are taken at a stride, not
# from the front, because the split is written manual sources first.
generation:
  split: test
  prompts: 200
  prefix_tokens: 64
  continuation_tokens: 96
  temperatures: [0.5, 1.0, 1.5]   # greedy is always included as well
  seed: 1337
  samples_shown: 8                # how many go into samples.md

# Head statistics average over 20 batches of 8 x 512 = 81,920 held-out tokens.
# The heatmaps then use one short sentence so the picture stays readable.
attention:
  batches: 20
  heatmap_layers: null            # null -> first and last layer
  example_count: 2
  examples:
    - "ગુજરાત સરકારે ૨૦૨૪ના શૈક્ષણિક વર્ષથી રાજ્યની તમામ પ્રાથમિક શાળાઓમાં માતૃભાષામાં શિક્ષણ ફરજિયાત બનાવવાનો નિર્ણય લીધો હતો."
    - "ઘર, ઘરમાં, ઘરોમાં, ઘરોમાંથી, ઘરવાળાં - એક જ મૂળ શબ્દમાંથી બનેલાં આ પાંચ રૂપો તપાસવાથી જણાય છે કે મૂળ શબ્દ અકબંધ રહે છે."

# Both held-out splits, whole, in float32. Windows are non-overlapping, so
# every token is predicted exactly once.
perplexity:
  splits: ['validation', 'test']
  batch_size: 16
