# Gujarati (Model H) - Phase 2 pretraining
#
# One pass over the tokenized training split: 518.6M tokens, 15,826 steps.
# The optimizer, schedule, batch size and seed are identical to the other
# language's, so differences in the results come from the corpus and the
# tokenizer rather than from tuning.

run_name: gujarati-25m-16k
paths_note: paths are relative to the gujarati/ directory

# Which vocabulary this run uses. Named explicitly, not left to whichever
# .model sorts first in tokenizer/model/: both candidates exist, and the wrong
# one would not fail loudly, it would tokenize the corpus with one table and
# train an embedding sized for the other.
#
# This is the 16k run reported in Phase 2. The 12k control run in
# report/phase2/vocab_comparison.md sets:
#   tokenizer_model: tokenizer/model/sweep/12k_unigram_guj.model
#   run_name: gujarati-25m-12k
#   data_dir / reports_dir / logs_subdir  -> their _12k names
#   configs/model.yaml n_layers: 12
#
# The 16k run was executed before the runs were suffixed, so the training log
# it produced records run_name "gujarati-25m". The log is left as written.
tokenizer_model: tokenizer/model/16k_unigram_guj.model

# Output paths carry the vocabulary, because the two runs write the same
# filenames and would otherwise overwrite each other.
data_dir: data/tokenized_16k      # written by train/prepare_data.py
runs_dir: train/runs              # checkpoints and metrics (gitignored)
reports_dir: ../report/phase2/gujarati/gujarati_16k
logs_subdir: pretrain_16k         # -> gujarati/logs/pretrain/pretrain_16k/

seed: 1337                        # same seed as the Phase 1 splits

# Batch: 32 sequences x 2 accumulation steps x 512 tokens = 32,768 tokens per
# update. The split into micro-batches is for memory only: 32 x 512 fits a 16 GB
# T4 alongside the (B, heads, 512, 512) attention matrices. Halve
# micro_batch_size and double gradient_accumulation_steps on a smaller card; the
# optimizer sees the same batch either way.
micro_batch_size: 32
gradient_accumulation_steps: 2

# Length of the run. epochs 1.0 means one pass over train.bin, with the step
# count derived from the actual token count at startup, so it stays correct if
# the corpus is rebuilt. max_steps overrides it when set.
epochs: 1.0
max_steps: null

# Optimizer: AdamW with beta2 at 0.95 instead of the 0.999 default. The
# second-moment estimate then adapts over ~20 steps rather than ~1000, which
# matters in a run this short. Weight decay applies to matrices only, see
# Trainer._build_optimizer.
learning_rate: 0.0006             # peak, after warmup
min_lr: 6.0e-05                     # cosine floor, 10% of peak
betas: [0.9, 0.95]
eps: 1.0e-08
weight_decay: 0.1
grad_clip: 1.0                    # clip the global gradient norm

# Schedule: linear warmup then cosine decay. 500 steps is ~3% of the run: long
# enough for Adam's moment estimates to settle, short enough not to waste the
# high-learning-rate phase.
warmup_steps: 500

# Precision. auto selects fp16 with a gradient scaler on Turing and Pascal
# (T4, P100) and bf16 on Ampere and newer. The choice reads the compute
# capability, not torch.cuda.is_bf16_supported(), which counts emulation: on a
# T4 that helper answers yes and the card then runs bf16 at fp32 speed, measured
# at 10.8k tokens/s against ~32k for fp16. The attention softmax and the RoPE
# rotation stay in float32 either way.
# Override with --precision bf16 | fp16 | fp32.
precision: auto

# Validation during training. eval_windows counts windows, not batches:
# 512 x 512 = 262,144 validation tokens per check, spread evenly across the
# split rather than taken from the front, because Phase 1 writes manual sources
# first and the head of the file is one register only. best.pt is selected on
# this number. Every reported metric is measured separately at the end by
# eval/perplexity.py over the complete validation and test splits.
eval_interval: 500
eval_windows: 512
log_interval: 20

# Checkpointing. Every 1000 steps is roughly 20 minutes on a T4, so an
# interrupted session costs at most that. latest.pt and best.pt are always kept;
# numbered checkpoints are pruned to the last two.
checkpoint_interval: 1000
keep_checkpoints: 2

# Read the ~1 GB training stream into RAM instead of memory-mapping it. Random
# block access is much faster once resident, and it fits.
preload_train: True
