# Gujarati (Model H) - Phase 2 pretraining
# One pass over the training split: 518.6M tokens, 15,826 steps, ~4.6 h on a T4.
# Optimizer, schedule, batch and seed match the other language, so differences
# in the results come from the corpus and the tokenizer.

run_name: gujarati-25m-16k
paths_note: paths are relative to the gujarati/ directory

# Stated explicitly, never guessed: the wrong tokenizer would not fail, it would
# encode with one table and train an embedding sized for another. The 12k
# control run swaps this for tokenizer/model/sweep/12k_unigram_guj.model, the
# four paths below for their _12k names, and n_layers to 12.
tokenizer_model: tokenizer/model/16k_unigram_guj.model
data_dir: data/tokenized_16k
runs_dir: train/runs                  # checkpoints and metrics (gitignored)
reports_dir: ../report/phase2/gujarati/gujarati_16k
logs_subdir: pretrain_16k

seed: 1337                            # same seed as the Phase 1 splits

# 32 x 2 x 512 = 32,768 tokens per optimizer step. Micro-batching is for memory
# only; the optimizer sees the same batch either way.
micro_batch_size: 32
gradient_accumulation_steps: 2

epochs: 1.0                           # step count derived from the token count
max_steps: null                       # overrides epochs when set

# AdamW, beta2 0.95 not 0.999: the second-moment estimate then adapts over ~20
# steps rather than ~1000, which matters in a run this short. Weight decay
# applies to matrices only, see Trainer._build_optimizer.
learning_rate: 0.0006                 # peak, after warmup
min_lr: 6.0e-05                       # cosine floor, 10% of peak
betas: [0.9, 0.95]
eps: 1.0e-08
weight_decay: 0.1
grad_clip: 1.0
warmup_steps: 500                     # ~3% of the run, then cosine decay

# fp16 with a scaler on Turing/Pascal, bf16 on Ampere and newer. Chosen by
# compute capability, not torch.cuda.is_bf16_supported(), which counts emulation.
precision: auto

# 512 windows = 262,144 tokens, spread across the split, every 500 steps.
# best.pt is selected on this. The reported metrics are measured separately by
# eval/perplexity.py over the complete validation and test splits.
eval_interval: 500
eval_windows: 512
log_interval: 20

checkpoint_interval: 1000             # ~20 minutes on a T4
keep_checkpoints: 2                   # numbered ones; best/latest always kept
preload_train: True                   # read the ~1 GB stream into RAM
