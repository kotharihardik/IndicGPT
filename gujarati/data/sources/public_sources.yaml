# =====================================================================
# Gujarati PUBLIC sources  (source_type: public, label: public_hf)
# =====================================================================
# These are downloaded datasets. They NEVER count towards the >=20% manual
# requirement, no matter how much cleaning we apply to them.
#
# Only the configured subset is streamed (e.g. data_dir: verified/guj), so the
# full multi-language dataset is never downloaded.
#
# CONFIRMED by me (the student): ai4bharat_sangraha / verified/guj — this is the
# dataset I am already using via load_dataset("ai4bharat/sangraha",
# data_dir="verified/guj").
#
# All other entries are DISABLED and marked NEEDS_DECISION: enable one only
# after verifying its path on huggingface.co with:
#   python data/collection/collect_public.py --dry-run --only <name>
# =====================================================================

sources:
  - name: ai4bharat_sangraha
    hf_path: ai4bharat/sangraha
    config_name: verified           # exact Hugging Face builder config name
    split: guj                      # verified Gujarati subset split name in HF
    text_field: text
    type: public
    category: web_corpus
    collection_method: public_download
    url: https://huggingface.co/datasets/ai4bharat/sangraha
    license: "see dataset card"
    description: "AI4Bharat Sangraha verified Gujarati subset only; cap at ~400M tokens (~1.6B chars)."
    max_chars: 1600000000           # ~400M tokens × ~4 chars/token; enough for model training target
    min_chars: 300
    enabled: true

  # --------- NEEDS_DECISION: enable only after you verify each one ---------
  - name: sangraha_unverified_guj
    hf_path: ai4bharat/sangraha
    data_dir: unverified/guj
    split: train
    text_field: text
    type: public
    category: web_corpus
    collection_method: public_download
    url: https://huggingface.co/datasets/ai4bharat/sangraha
    license: "see dataset card"
    description: "NEEDS_DECISION — unverified Sangraha Gujarati subset; noisier, more volume."
    max_chars: 0
    enabled: false

  - name: NEEDS_DECISION_additional_public_gujarati
    hf_path: ""                     # TODO: fill in only after checking the dataset card
    data_dir: ""
    split: train
    text_field: text
    type: public
    category: web_corpus
    collection_method: public_download
    url: ""
    license: ""
    description: >
      NEEDS_DECISION — placeholder for any further public Gujarati corpus you
      decide to add (e.g. a Wikipedia dump or another Indic web corpus). Do not
      enable until you have verified the exact hf_path / subset name yourself.
    enabled: false
