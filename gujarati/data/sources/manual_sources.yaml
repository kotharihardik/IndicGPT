# Gujarati MANUAL sources (Model H, Phase 1)
#
# These are the sources I collect myself, and only these count toward the
# ">=20% of final training tokens from manual collection" requirement. The
# other ~80% comes from the public dataset in public_sources.yaml, which
# is labelled public_hf and can never count as manual.
#
# Four collection methods, one adapter module each. See
# data/collection/adapters/ for why each one exists.
#
#   wp_rest      WordPress REST API, 100 articles per request
#   sitemap      sitemap.xml (or a link crawl), one request per page
#   pdf          PyMuPDF text layer from books already on disk
#   ia_fulltext  archive.org's own server-side OCR output
#
# WHAT WAS ACTUALLY COLLECTED (13 sources, 214,885 docs, 698.7M chars)
#
#   wp_rest      433.0M chars   62.0%
#   ia_fulltext  152.8M chars   21.9%
#   sitemap      109.2M chars   15.6%
#   pdf            3.7M chars    0.5%
#
# HOW THE SOURCES WERE CHOSEN (probed 2026-08-12)
#
# I checked 63 candidate Gujarati domains for four things: the robots.txt
# verdict, whether any text could be extracted at all, how much exists,
# and how fast it comes out. The rejections are recorded here on purpose,
# because "I checked and it does not work" is part of the deliverable.
#
#   REJECTED
#     loksatta.com         WP API open, 992,573 posts, but MARATHI
#                          (Gujarati ratio 0.00). Wrong language.
#     deshgujarat.com      WP API open, 78,394 posts, but ENGLISH
#                          (ratio 0.01). The name is not the language.
#     matrubharti.com      296,146 sitemap URLs but JS-rendered: 0 of 15
#                          probed pages gave any text.
#     gujaratsamachar.com  JS-rendered, 1 of 15 pages gave text.
#     readgujarati.com     robots.txt DISALLOW. Not crawled.
#     oneindia.com         robots.txt DISALLOW. Not crawled.
#     gu.wikisource.org    Excluded on instruction: no Wikimedia-family
#                          sources. It would also have largely deduplicated
#                          away, since Wikimedia text is already inside the
#                          public Sangraha dataset.
#
# MEASURED SPEED, which is why the mix looks like this
#     wp_rest                     ~570 K chars/s   (100 articles/request)
#     sitemap                       ~7 K chars/s   (1 article/request)
#     my first serial crawler       ~0.9 K chars/s (replaced)
#
#   Sitemap sources cost roughly 80x more time per character, so their
#   budgets are small. They are here for register diversity, not volume:
#   a corpus built only from newsrooms is a corpus of house styles.
#
# SIX SOURCES WITHDRAWN (16 Aug 2026)
#
#   mantavyanews, gujaratmirror, loksansar, sunvillasamachar, eaglenews
#   and gstv were removed from this file. Together they were 248.9M raw
#   chars of WordPress news, the register the corpus already had far too
#   much of. Their shards were moved to data/archive/manual/ and NOT
#   deleted, so the run is reproducible from the archive if needed.
#   data/archive/ sits outside data/raw/, which is what read_docs() walks,
#   so the pipeline no longer sees them.
#
#   The corpus still finished at 540.8M tokens with manual at 31.6%,
#   comfortably over both the 500M target and the 20% floor.
#
# OPEN ISSUE
#
#   If WordPress REST output is counted as structured data rather than as
#   manual collection, non-WordPress manual is only ~13% of the corpus,
#   under the 20% floor. Removing more data cannot fix this: it shrinks
#   the denominator as fast as the numerator. Closing it needs roughly
#   178M more raw non-WordPress chars, i.e. more collection.

defaults:
  type: manual
  # Concurrent requests to one host. Politeness is this ceiling, not a
  # sleep between requests - which is what made the old crawler slow.
  concurrency: 8

sources:

  # WordPress REST API: almost all of the corpus

  - name: abtakmedia
    method: wp_rest
    url: "https://www.abtakmedia.com/"
    category: news_regional
    license: >
      Article text retrieved from the site's own public WordPress REST
      API; robots.txt permits /wp-json for our agent. Collected for
      non-commercial academic research (Indian Copyright Act s.52(1)(a)).
      The text itself is not redistributed - only derived statistics,
      the tokenizer and the trained model are published.
    description: >
      Abtak Media, a Rajkot news group covering Saurashtra. The largest
      single reservoir found and the fastest to read, so it is the
      primary volume source.
    max_chars: 160_000_000
    enabled: true

  - name: westerntimesnews
    method: wp_rest
    url: "https://westerntimesnews.in/"
    category: news_general
    license: >
      Public WordPress REST API, robots.txt allows /wp-json. Academic
      research use as above; text is not redistributed.
    description: >
      Western Times, an Ahmedabad daily: city news plus entertainment and
      lifestyle copy. Shorter articles and a lighter register than the
      Rajkot papers.
    max_chars: 95_000_000
    enabled: true

  - name: gujarativishwakosh
    method: wp_rest
    url: "https://gujarativishwakosh.org/"
    category: encyclopedia
    license: >
      Gujarati Vishwakosh Trust, public WordPress REST API; robots.txt
      allows /wp-json. Academic research use as above; not redistributed.
    description: >
      The Gujarati-language encyclopedia: 26,475 signed scholarly entries
      on science, history, geography, art and biography. The most
      valuable source here for a reason other than size - it is the only
      formal, technical, expository register in the corpus. News prose
      alone would leave the tokenizer poorly fitted to academic and
      scientific vocabulary. Its entries are dated from 2009 and older,
      so it also widens the corpus in time.
    concurrency: 5
    max_chars: 85_000_000
    enabled: true

  - name: sandesh
    method: sitemap
    url: "https://sandesh.com/"
    hosts: ["sandesh.com"]
    category: news_general
    license: >
      Pages we fetched and extracted ourselves. Academic research use as
      above; text is not redistributed.
    description: >
      Sandesh, a major Gujarati daily from a different newspaper group
      than every other source here.
      NOTE: an early probe recorded robots.txt DISALLOW and this source
      was disabled; re-probing found ALLOW. Because that can change back,
      the collector re-checks robots.txt at every run and skips the
      source if the verdict changes - the answer is not trusted to this
      comment.
    sitemaps:
      - "https://sandesh.com/sitemap-index.xml"
      - "https://sandesh.com/sitemap.xml"
    deny:
      - "/video"
      - "/photo"
      - "/gallery"
      - "/web-stor"
      - "/live-"
      - "/tag/"
      - "/author/"
      - "/topic/"
      - "\\?"
    max_pages: 20000
    max_chars: 12_000_000
    enabled: true

  - name: divya_bhaskar
    method: sitemap
    url: "https://www.divyabhaskar.co.in/"
    hosts: ["divyabhaskar.co.in"]
    category: news_national
    license: >
      Pages we fetched and extracted ourselves, robots.txt permitting.
      Academic research use as above; text is not redistributed.
    description: >
      Divya Bhaskar, the highest-circulation Gujarati daily. 10.3M chars
      were already collected by the first version of this collector and
      are kept - the data is valid and re-collecting it would be waste.
      The budget is small because only the google-news sitemap is
      published, so no amount of crawling reaches the older archive.
    sitemaps:
      - "https://www.divyabhaskar.co.in/sitemaps-v1--sitemap-google-news-index.xml"
    deny:
      - "/video"
      - "/photo"
      - "/epaper"
      - "/gallery"
      - "/cricket-score"
      - "/live-score"
      - "/live-blog"
      - "/web-stor"
      - "/shorts"
      - "/author/"
      - "/tag/"
      - "\\?"
    concurrency: 6
    max_pages: 15000
    max_chars: 15_000_000
    enabled: true

  # ADDED 2026-08-13 — diversity + AI-training-permitted sources
  # Two reasons for this batch:
  #
  # 1. REGISTER BALANCE. The corpus was ~97% news. The two literary
  #    sources below are the first non-news web text in it.
  #
  # 2. LICENSING HEADROOM. abtakmedia, mantavyanews and gujarativishwakosh
  #    all declare `Content-Signal: search=yes,ai-train=no,use=reference`
  #    in robots.txt - an explicit refusal of collection for model
  #    training, asserted under Article 4 of EU Directive 2019/790.
  #    They were collected before that check existed and are being kept
  #    for now, but they are 93.7M of 133.3M manual tokens. Every source
  #    below was verified to carry NO such restriction, so the manual
  #    bucket can survive dropping them.
  #
  # All of these were checked for `ai-train` explicitly. Sites REJECTED
  # for declaring ai-train=no: navgujaratsamay.com, ahmedabadmirror.com,
  # newsjoo.in, gsebsolutions.com, gujaratilexicon.com, swaminarayan.faith,
  # vishwakosh.org.
  #
  # Academic sources were sought and mostly failed: GSEB/GCERT textbook
  # portals and Gujarat government sites expose no crawlable listings
  # (form-driven PDF downloads only), and archive.org's Gujarati book
  # collection (1,152 items) returns HTTP 404 for the `_djvu.txt` text
  # derivative, leaving only 35 MB PDFs at 10-300 KB/s ~ 112 hours.

  # Literary / opinion: the non-news register

  - name: opinionmagazine
    method: sitemap
    url: "https://opinionmagazine.co.uk/"
    hosts: ["opinionmagazine.co.uk"]
    category: literature_opinion
    license: >
      Pages we fetched and extracted ourselves. robots.txt permits crawling
      and declares no Content-Signal restriction on AI-training use.
      Academic research use; text is not redistributed.
    description: >
      Opinion Magazine - Gujarati literary and opinion magazine published
      from the UK. 15,263 URLs at 5,544 chars average, Gujarati ratio 0.78.
      The single best diversity addition in the project: it is simultaneously
      NON-NEWS (essays, criticism, literary opinion) and DIASPORA Gujarati
      written outside India. Nothing else in the corpus resembles it.
      Slow (~1.4 h) because it is one request per article, and worth it.
    deny:
      - "/tag/"
      - "/author/"
      - "/category/"
      - "/page/[0-9]"
      - "\\?"
    page_concurrency: 6
    concurrency: 6
    max_pages: 16000
    max_chars: 70_000_000
    enabled: true

  - name: aksharnaad
    method: sitemap
    url: "https://aksharnaad.com/"
    hosts: ["aksharnaad.com"]
    category: literature
    license: >
      Pages we fetched and extracted ourselves; robots.txt permits it and
      declares no ai-train restriction. Not redistributed.
    description: >
      Aksharnaad - contemporary Gujarati literary portal: short stories,
      essays, poetry, travel writing. 3,196 URLs at 6,760 chars average,
      Gujarati ratio 0.78. Long-form literary prose that no news source
      supplies, and the register a tokenizer most needs to see beyond
      journalism.
    deny:
      - "/tag/"
      - "/author/"
      - "/category/"
      - "/page/[0-9]"
      - "\\?"
    page_concurrency: 6
    concurrency: 6
    max_pages: 4000
    max_chars: 25_000_000
    enabled: true

  # Additional news, all ai-train-permitted

  - name: gujarattoday
    method: wp_rest
    url: "https://gujarattoday.in/"
    category: news_general
    license: >
      Public WordPress REST API; robots.txt allows it and declares no
      ai-train restriction. Academic research use; not redistributed.
    description: >
      Gujarat Today - daily published by the Lokhit Prakashan Sarvajanik
      Trust. 50,606 posts at 2,013 chars. Largest ai-train-permitted source
      found, and editorially distinct from the Rajkot/Ahmedabad mainstream
      papers already in the corpus.
    per_page: 100
    max_chars: 102_000_000
    enabled: true

  - name: gujaratabroad
    method: wp_rest
    url: "https://gujaratabroad.ca/"
    category: news_diaspora
    license: >
      Public WordPress REST API, no ai-train restriction declared.
      Academic research use; not redistributed.
    description: >
      Gujarat Abroad - Gujarati newspaper published in Canada. 6,654 posts
      at 3,216 chars. Diaspora Gujarati: different subject matter, different
      code-switching with English, written far outside Gujarat. Small but
      linguistically distinctive.
    per_page: 100
    max_chars: 21_000_000
    enabled: true

  - name: ia_books_pdf
    method: pdf
    url: "https://archive.org/details/booksbylanguage_gujarati"
    local_dir: data/raw/manual/pdfs
    category: books
    license: >
      Mixed, per item. Per-item rights are recorded in
      data/raw/pdfs/books/manifest.csv by fetch_ia_pdfs.py, which skips
      lending-restricted items, so everything on disk is openly
      downloadable.
    description: >
      Gujarati books from the Internet Archive, downloaded by us, with
      text extracted by our own code. Book-length literary and religious
      prose that no news source supplies.
      The budget is small for measured reasons: archive.org served these
      PDFs at 10-300 KB/s (the logged ETA for the originally planned
      12 GB was 341 hours), and Tesseract on this machine has no 'guj'
      model, so image-only scans cannot be read at all. Install it with
      'brew install tesseract-lang' or 'apt install tesseract-ocr-guj'.
      About a third of the PDFs also return a text layer with Gujarati
      ratio 0.00 - a broken embedded font encoding producing mojibake -
      and the script-ratio filter correctly rejects those.
    split_chars: 300_000
    max_chars: 6_000_000
    enabled: true

  # NON-WORDPRESS DIVERSIFICATION  (added 15 Aug 2026)
  # The corpus was 87% WordPress by volume. The TA indicated WordPress
  # REST API output may count as structured data toward the 80% public
  # share rather than as manual collection, so these sources deliberately
  # avoid it: books and hand-crawled pages only.
  # Each was probed first - robots.txt checked, WordPress detection run,
  # text extracted and Gujarati script ratio measured - and the numbers
  # below are what the probe actually returned, not estimates.

  - name: ia_books_fulltext
    method: ia_fulltext
    url: "https://archive.org/details/booksbylanguage_gujarati"
    ia_query: "language:(gujarati) AND mediatype:(texts)"
    category: books
    license: >
      Mixed, per item. Only openly downloadable items return the DjVuTXT
      file; lending-restricted items answer 403 and are skipped.
    description: >
      Gujarati books from the Internet Archive, read through archive.org's
      own server-side OCR output (the DjVuTXT file) instead of downloading
      and parsing the scanned PDFs. This sidesteps both problems that
      capped ia_books_pdf at 6M chars: the PDFs download at 10-300 KB/s,
      and image-only scans need a Gujarati Tesseract model that is not
      installed. The OCR text is a few hundred KB per book instead of tens
      of MB, and needs no local OCR at all.
      Measured on a 20-item sample: 984 Gujarati text items exist, 15/20
      expose DjVuTXT (the rest are lending-restricted), and 13/15 of those
      pass the Gujarati script filter at 43-67% script ratio, averaging
      377K chars per book. Projected yield ~322M chars in ~1.5 hours.
      NOTE: provenance is manual_web, not manual_ocr - archive.org did the
      recognition, we did not.
    split_chars: 300_000
    max_chars: 400_000_000
    enabled: true

  # REMOVED 15 Aug 2026: gu.wikisource.org (public-domain Gujarati books).
  # Excluded on instruction - no Wikimedia-family sources. It probed well
  # (4,056 URLs by link crawl, script ratio 0.65) and had started collecting,
  # but the entry, its shards and its log were all deleted rather than left
  # disabled, so nothing Wikimedia-derived reaches the corpus.

  - name: layastaro
    method: sitemap
    url: "https://layastaro.com/"
    category: poetry
    description: >
      Long-running Gujarati poetry site. Probe: 1,021 URLs, average 2,629
      chars per page, script ratio 0.63, 80% hit rate. Poetry is the
      register furthest from news prose, so it is worth more to the
      tokenizer than its size suggests.
    max_chars: 25_000_000
    enabled: true

  - name: webdunia_gujarati
    method: sitemap
    url: "https://gujarati.webdunia.com/"
    category: portal_mixed
    description: >
      Mixed-register Gujarati portal - religion, astrology, health,
      literature and lifestyle rather than straight news. Probe: 631 URLs,
      average 2,103 chars, script ratio 0.52, 70% hit rate.
    max_chars: 25_000_000
    enabled: true
