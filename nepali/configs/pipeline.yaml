# Nepali (Model L) — Phase 1 pipeline configuration

language: nep
language_name: Nepali



paths:
  raw:              data/raw
  raw_public:       data/raw/public
  raw_manual:       data/raw/manual
  clean:            data/clean
  dedup:            data/dedup
  splits:           data/splits/out
  tokenizer:        tokenizer
  tokenizer_model:  tokenizer/model
  tokenizer_vocab:  tokenizer/vocab
  logs:             logs
  state:            data/state
  reports:          ../report/phase1/nepali   # this phase's tables and figures

repeated_line_df: 50

targets:
  corpus_tokens: 500.0e6
  manual_fraction: 0.20
  collection_headroom: 1.25

tokens:

  chars_per_token: 4.0

crawl:
  user_agent: "LMA-Monsoon2026-StudentCrawler/0.2 (academic corpus collection; contact: hardikkothari300@gmail.com)"
  host_concurrency: 5
  host_spacing: 0.2
  timeout: 45
  max_retries: 4
  min_chars: 400


collect_quality:
  min_chars: 200
  min_words: 20
  min_script_ratio: 0.60          # Devanagari share of letters
  min_nepali_marker_rate: 2.0     # see `quality:` below
  max_latin_ratio: 0.35
  max_digit_ratio: 0.30
  min_stopword_hits: 2

ocr:

  tesseract_lang: nep
  dpi: 300

# Normalisation — close to Gujarati, since both are Devanagari-family
normalize:
  strip_zwj: true             # U+200D: not needed for Devanagari rendering
  keep_zwnj: true             # U+200C can block a conjunct -> keep
  map_digits_to_native: true  # 0-9 -> native-script digits (TA ruling: digits
                            # may stay, but in the language's own script)
  strip_latin_words: true     # remove non-language words entirely, including
                            # proper nouns such as Tata / IRCTC (TA ruling)   # Devanagari ०-९ -> 0-9
  normalize_danda: true       # । and ॥ spacing
  strip_urls: true
  strip_emails: true


quality:
  min_chars: 250
  max_chars: 800000
  min_words: 30
  min_mean_word_len: 2.0
  max_mean_word_len: 15.0
  min_script_ratio: 0.80        # >=80% of letters are Devanagari
  min_nepali_marker_rate: 3.0   # Nepali marker words per 1000 chars
  min_nepali_hindi_ratio: 1.5   # Nepali markers must outnumber Hindi 1.5:1
  max_latin_ratio: 0.15
  min_stopword_hits: 3
  max_digit_ratio: 0.15
  max_duplicate_line_fraction: 0.30
  max_top_2gram: 0.18
  max_top_3gram: 0.16
  max_top_4gram: 0.14

splits:
  seed: 1337
  val_fraction: 0.05
  test_fraction: 0.05
  val_max_chars: 1.7e8   # headroom so the 5% fraction binds, not the cap
  test_max_chars: 1.7e8
  heldout_sources: []

# Tokenizer (SentencePiece Unigram, trained from scratch on Nepali)
tokenizer:
  algorithm: sentencepiece_unigram

  vocab_size: 16000
  sweep_vocab_sizes: [8000, 12000, 16000, 24000, 32000]

  character_coverage: 0.9995
  max_piece_length: 16

  train_text_max_chars: 2.50e8  # ~10% of the train split
  input_sentence_size: 3000000  # lines SentencePiece loads. Must be

  num_threads: 8
  large_corpus: true       
  seed_sentencepiece_size: 200000  

  seed: 1337

  model_dim: 384
  target_params: 25.0e6

  eval_examples:
    - "नेपाल सरकारले २०८१ सालको बजेटमा शिक्षा र स्वास्थ्य क्षेत्रका लागि छुट्याइएको रकम बढाउने निर्णय गरेको छ।"
    - "यस अनुसन्धानपत्रमा लेखकले भाषाशास्त्रीय दृष्टिकोणबाट नेपाली क्रियापदका रूपान्तरणको प्रक्रियाको विश्लेषण प्रस्तुत गरेका छन्।"
    - "घर, घरमा, घरहरूमा, घरहरूबाट, घरवालाहरू - एउटै मूल शब्दबाट बनेका यी पाँच रूपहरू हेर्दा मूल शब्द अक्षुण्ण रहेको देखिन्छ।"
