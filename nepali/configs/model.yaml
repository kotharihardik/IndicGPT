# Nepali (Model L) - Phase 2 model architecture
# ~25M trainable parameters. vocab_size is read from the tokenizer at build
# time, not set here. `python3 model/param_budget.py` prints the breakdown.

d_model: 384
n_layers: 11              # what the budget leaves after a 6.14M embedding
n_heads: 6                # head_dim = 384 / 6 = 64
d_ff: 1024                # SwiGLU uses 3 matrices of this width
context_length: 512

# RoPE costs no parameters and is relative, so length is not capped by a table.
# Alternatives implemented: learned, sinusoidal, none.
positional: rope
rope_theta: 10000.0

ffn_activation: swiglu    # at d_ff 1024 this costs what gelu at 1536 costs
norm_eps: 1.0e-05         # pre-norm: the LayerNorm sits inside each residual branch
tie_embeddings: True      # output head reuses the embedding, saving 6.14M
bias: False               # LayerNorm already re-centres every sublayer input

# 0.0 for pretraining: one pass over ~490M tokens, so nothing to memorise.
# Wired at all three sites (embedding, attention, sublayer) and used in Phase 3.
dropout: 0.0
attn_dropout: 0.0

init_std: 0.02

# Fixed by the Phase 1 tokenizer, repeated here so the model can be built
# without loading SentencePiece.
pad_id: 0
unk_id: 1
bos_id: 2
eos_id: 3
