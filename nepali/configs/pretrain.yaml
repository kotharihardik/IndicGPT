# Nepali (Model L) - Phase 2 pretraining

run_name: nepali-25m-16k
paths_note: paths are relative to the nepali/ directory


tokenizer_model: tokenizer/model/16k_unigram_nep.model
data_dir: data/tokenized_16k
runs_dir: train/runs                  
reports_dir: ../report/phase2/nepali/nepali_16k
logs_subdir: pretrain_16k

seed: 1337                            # same seed as the Phase 1 splits

# 32 x 2 x 512 = 32,768 tokens per optimizer step. Micro-batching is for memory
# only; the optimizer sees the same batch either way.
micro_batch_size: 32
gradient_accumulation_steps: 2

epochs: 1.0                           # step count derived from the token count
max_steps: null                       # overrides epochs when set

learning_rate: 0.0006                 # peak, after warmup
min_lr: 6.0e-05                       # cosine floor, 10% of peak
betas: [0.9, 0.95]
eps: 1.0e-08
weight_decay: 0.1
grad_clip: 1.0
warmup_steps: 500                     

# fp16 with a scaler on Turing/Pascal, bf16 on Ampere and newer. Chosen by
precision: auto


eval_interval: 500
eval_windows: 512
log_interval: 20

checkpoint_interval: 1000       
keep_checkpoints: 2                
preload_train: True               
