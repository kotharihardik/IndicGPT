    deny: ["/tag/", "/author/", "/category/", "/page/[0-9]", "\\?"]
    page_concurrency: 10
    concurrency: 10
    max_pages: 45000
    max_chars: 85000000
    enabled: true

  - name: sahityasangraha_html
    method: sitemap
    url: "https://sahityasangraha.com/"
    hosts: ["sahityasangraha.com"]
    category: literature
    license: >
      Pages fetched and extracted by us from HTML, via sitemap.xml.
