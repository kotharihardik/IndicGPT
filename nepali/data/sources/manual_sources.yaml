    description: >
      Edu Khabar - EDUCATION policy, schools, universities. Link-crawled; pedagogical and policy register.
    deny: ["/tag/", "/author/", "/category/", "/page/[0-9]", "\\?"]
    page_concurrency: 8
    concurrency: 8
    max_depth: 6
    max_pages: 6000
    max_chars: 10000000
    enabled: true

  - name: krishisanjal
    method: sitemap
    url: "https://krishisanjal.com/"
    hosts: ["krishisanjal.com"]
    category: agriculture
    license: >
