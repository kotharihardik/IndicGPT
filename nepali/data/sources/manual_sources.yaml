  - name: nkp_legal
    method: sitemap
    url: "https://nkp.gov.np/"
    hosts: ["nkp.gov.np"]
    category: legal
    license: >
      Pages fetched and extracted by us from HTML. robots.txt permits it.
      Academic research use; text is not redistributed.
    description: >
      Nepal Kanoon Patrika - the official LAW REPORTS of Nepal. Link-crawled. Statute and judgment language, complementing the Supreme Court PDFs.
    deny: ["/tag/", "/author/", "/category/", "/page/[0-9]", "\\?"]
    page_concurrency: 8
    concurrency: 8
    max_depth: 6
    max_pages: 3000
    max_chars: 5000000
    enabled: true

  # ---- Legal PDFs: the manual_pdf bucket ---------------------------- #

  - name: court_pdf
    method: pdf
    url: "https://supremecourt.gov.np/"
    local_dir: data/raw/manual/pdfs/court
    category: legal
    license: >
      Judgments, statutes and codes published by the Supreme Court of Nepal
      as public documents. Downloaded by us; text extracted by our own code.
      Academic research use; not redistributed.
    description: >
      Supreme Court of Nepal - 199 PDFs (559 MB) of judgments, procedural
      codes and statutes. LEGAL prose: statute language, judicial reasoning,
      formal legal register that no news, business or literature source
      carries.
      Text-layer extraction with PyMuPDF, NOT OCR - measured on a sample,
      3 of 6 PDFs carry a real Devanagari text layer averaging 21,371
      chars. Scanned ones without a text layer are skipped, and documents
      failing the Nepali marker test are rejected like any other source.
      Labelled manual_pdf / pdf_text_layer so the method is not
      misdescribed.
    split_chars: 300_000
    max_chars: 20_000_000
    enabled: true
