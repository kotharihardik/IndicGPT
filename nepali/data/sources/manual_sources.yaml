    description: >
      Sahitya Sangraha - LITERATURE: poetry, short stories, essays, criticism.
      Collected by HTML crawling rather than the WordPress REST API, so the
      manual bucket does not depend on the API method. Same publisher as the
      `sahityasangraha` entry above; whichever copy of an overlapping article is seen
      first survives deduplication, and both are equally manual.
    deny: ["/tag/", "/author/", "/category/", "/page/[0-9]", "\\?"]
    page_concurrency: 10
    concurrency: 10
    max_pages: 40000
    max_chars: 80000000
    enabled: true

  - name: nepalpress_html
    method: sitemap
    url: "https://nepalpress.com/"
    hosts: ["nepalpress.com"]
    category: news_general
    license: >
      Pages fetched and extracted by us from HTML, via sitemap.xml.
      robots.txt permits article paths. Academic research use; text is not
      redistributed.
    description: >
      Nepal Press - general news.
      Collected by HTML crawling rather than the WordPress REST API, so the
      manual bucket does not depend on the API method. Same publisher as the
      `nepalpress` entry above; whichever copy of an overlapping article is seen
      first survives deduplication, and both are equally manual.
    deny: ["/tag/", "/author/", "/category/", "/page/[0-9]", "\\?"]
    page_concurrency: 10
    concurrency: 10
    max_pages: 45000
    max_chars: 75000000
    enabled: true

  - name: clickmandu_html
    method: sitemap
    url: "https://clickmandu.com/"
    hosts: ["clickmandu.com"]
    category: business_economics
    license: >
      Pages fetched and extracted by us from HTML, via sitemap.xml.
      robots.txt permits article paths. Academic research use; text is not
