    description: >
      Krishi Sanjal - AGRICULTURE extension and farming. Link-crawled. Agricultural/technical vocabulary found nowhere else in the corpus.
    deny: ["/tag/", "/author/", "/category/", "/page/[0-9]", "\\?"]
