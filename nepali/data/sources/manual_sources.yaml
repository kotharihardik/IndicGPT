    description: >
      Clickmandu - BUSINESS: banking, markets, economics.
      Collected by HTML crawling rather than the WordPress REST API, so the
      manual bucket does not depend on the API method. Same publisher as the
      `clickmandu` entry above; whichever copy of an overlapping article is seen
      first survives deduplication, and both are equally manual.
    deny: ["/tag/", "/author/", "/category/", "/page/[0-9]", "\\?"]
    page_concurrency: 10
    concurrency: 10
    max_pages: 20000
    max_chars: 45000000
    enabled: true

  # ---- Non-news registers (added 2026-08-14, link-crawl capable) ----
  # Health, education, agriculture and law publish almost no sitemaps in
  # Nepal, so these are reached by following links from the homepage.
  # Slower and less complete than sitemap crawling, but without it these
  # four registers are entirely missing from the corpus.

  - name: arthasarokar
    method: sitemap
    url: "https://arthasarokar.com/"
    hosts: ["arthasarokar.com"]
    category: finance
    license: >
      Pages fetched and extracted by us from HTML. robots.txt permits it.
      Academic research use; text is not redistributed.
    description: >
      Artha Sarokar - economics and finance journalism. 16,000 sitemap URLs at 2,354 chars, Nepali marker rate 11.1.
    deny: ["/tag/", "/author/", "/category/", "/page/[0-9]", "\\?"]
    page_concurrency: 8
    concurrency: 8
    max_depth: 3
    max_pages: 16000
    max_chars: 38000000
    enabled: true

  - name: swasthyakhabar
    method: sitemap
    url: "https://swasthyakhabar.com/"
    hosts: ["swasthyakhabar.com"]
    category: health
    license: >
      Pages fetched and extracted by us from HTML. robots.txt permits it.
      Academic research use; text is not redistributed.
    description: >
      Swasthya Khabar - HEALTH and medicine. No sitemap, so reached by link-crawling. Medical/clinical vocabulary absent from every other source.
    deny: ["/tag/", "/author/", "/category/", "/page/[0-9]", "\\?"]
    page_concurrency: 8
    concurrency: 8
    max_depth: 3
    max_pages: 8000
    max_chars: 15000000
    enabled: true

  - name: edukhabar
    method: sitemap
    url: "https://edukhabar.com/"
    hosts: ["edukhabar.com"]
    category: education
    license: >
      Pages fetched and extracted by us from HTML. robots.txt permits it.
